name: Build CareerSignal container

on:
  push:
    branches: [main]
    paths:
      - 'CareerSignal-Web/**'
      - '.github/workflows/careersignal-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: CareerSignal-Web/.nvmrc
          cache: npm
          cache-dependency-path: CareerSignal-Web/package-lock.json

      - name: Install dependencies and test gateway
        working-directory: CareerSignal-Web
        run: npm ci && npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/careersignal-web
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./CareerSignal-Web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
