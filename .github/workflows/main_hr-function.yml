# Replace .github/workflows/main_hr-function.yml with this workflow.
name: Build and deploy CareerSignal Azure Function App

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main_hr-function.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate syntax and run tests
        run: npm run check && npm test

      - name: Create deployment package
        run: zip -r release.zip host.json package.json package-lock.json src node_modules

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: careersignal-function
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: careersignal-function

      - name: Extract deployment package
        run: unzip -q release.zip -d package

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: hr-function
          package: package
          sku: flexconsumption
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_62B79807517944F88A807217A59CBBC7 }}
